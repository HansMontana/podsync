# Example podsync configuration.
# This file is a template; authoritative configuration belongs on the iPod.

[[source]]
id = "news"
url = "https://example.com/rss"

[[feed]]
id = "example"
title = "Example Feed"
source = "news"
order = "newest_first"
limit = 5
unplayed_only = true

[[briefing]]
id = "morning"
title = "Morning Briefing"

[[briefing.section]]
feed = "example"
order = "newest_first"
limit = 1
unplayed_only = true
